syntax="proto3";

package groom;

import "google/protobuf/empty.proto";

message DoorLockRequest {
    string msg = 1;
    oneof auth {
        string pass = 2;
        string token = 3;
        int32 icode = 4;
        string rrr= 5;
    }
}


message DoorLockResponse{
    string ans = 1;
}


service Door {
    rpc SendCommandToDoor(DoorLockRequest) returns (DoorLockResponse);
    rpc showMetadata(google.protobuf.Empty) returns (google.protobuf.Empty);
}
